        }
        .customoverlay:after {

        var bounds = new kakao.maps.LatLngBounds();

        sites.forEach(function(site) {
            var position = new kakao.maps.LatLng(site.lat, site.lng);
            
            // 마커 생성
            var marker = new kakao.maps.Marker({
                map: map,
                position: position,
                title: site.name
            });
            
            bounds.extend(position);
            
            var badgeClass = "badge-cntrct";
            var sourceName = "계약확정";
            if (site.source === "MOLIT_PERMIT") { badgeClass = "badge-molit"; sourceName = "건축허가"; }
            else if (site.source === "HUG") { badgeClass = "badge-hug"; sourceName = "분양진행"; }
            
            var content = `

                    <span class="badge ${badgeClass}">${sourceName}</span>

                    <p><strong>주소:</strong> ${site.address}</p>
                </div>
            `;
            
            var overlay = new kakao.maps.CustomOverlay({
                content: content,
                position: marker.getPosition(),
                yAnchor: 1.2,
                zIndex: 3
            });
            
            // 마커 클릭 시 인포윈도우 표시 (기존 창 닫기)
            kakao.maps.event.addListener(marker, 'click', function() {
                if (clickedOverlay) {
                    clickedOverlay.setMap(null);
                }
                if (clickedOverlay !== overlay) {
                    overlay.setMap(map);
                    clickedOverlay = overlay;
                    map.panTo(position); // 클릭한 마커로 부드럽게 이동
                } else {
                    clickedOverlay = null;
                }
            });
            
            // 지도 빈 공간 클릭 시 인포윈도우 닫기

                }
            });
